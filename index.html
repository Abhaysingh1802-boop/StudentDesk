<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        :root {
            --bg: #14120f;
            --panel: #1c1a16;
            --border: #2e2a23;
            --brass: #b8874f;
            --brass-bright: #d9a662;
            --text: #f0ece2;
            --muted: #9a9384;
            --error: #c96a5a;
            --ok: #7fa07a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            background-image:
                radial-gradient(circle at 20% 20%, rgba(184, 135, 79, 0.06), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(184, 135, 79, 0.05), transparent 40%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--text);
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 36px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--brass), transparent);
        }

        .eyebrow {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--brass);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .eyebrow .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--brass);
        }

        h1 {
            font-size: 22px;
            margin: 0 0 6px;
            font-weight: 600;
        }

        .sub {
            color: var(--muted);
            font-size: 13.5px;
            margin: 0 0 28px;
            line-height: 1.5;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 12.5px;
            color: var(--muted);
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background: #100f0c;
            border: 1px solid var(--border);
            border-radius: 7px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color .15s ease, box-shadow .15s ease;
        }

        input::placeholder {
            color: #5c5748;
        }

        input:focus {
            border-color: var(--brass);
            box-shadow: 0 0 0 3px rgba(184, 135, 79, 0.15);
        }

        input:read-only {
            color: var(--muted);
            background: #0d0c0a;
        }

        input.err {
            border-color: var(--error);
        }

        .hint {
            font-size: 12px;
            margin-top: 6px;
            min-height: 14px;
        }

        .hint.err {
            color: var(--error);
        }

        .hint.ok {
            color: var(--ok);
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: var(--brass);
            color: #14120f;
            font-size: 14.5px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s ease, transform .1s ease;
            letter-spacing: 0.3px;
        }

        button:hover {
            background: var(--brass-bright);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #3a3529;
            color: #78715f;
            cursor: not-allowed;
        }

        .link-btn {
            background: none;
            border: none;
            color: var(--brass);
            font-size: 12.5px;
            cursor: pointer;
            padding: 0;
            width: auto;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .link-btn:hover {
            color: var(--brass-bright);
            background: none;
        }

        .link-btn:disabled {
            color: var(--muted);
            text-decoration: none;
            cursor: not-allowed;
            background: none;
        }

        .row-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
        }

        .step-indicator {
            display: flex;
            gap: 6px;
            margin-bottom: 26px;
        }

        .step-indicator span {
            height: 3px;
            flex: 1;
            background: var(--border);
            border-radius: 2px;
            transition: background .3s ease;
        }

        .step-indicator span.active {
            background: var(--brass);
        }

        .back {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 12.5px;
            cursor: pointer;
            padding: 0 0 20px;
            width: auto;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .back:hover {
            color: var(--text);
            background: none;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .mode-toggle {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }

        .mode-toggle button {
            flex: 1;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 9px;
        }

        .mode-toggle button.active {
            background: var(--brass);
            border-color: var(--brass);
            color: var(--bg);
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="mode-toggle" aria-label="Account action">
            <button id="signupModeBtn" class="active" type="button" onclick="setMode('signup')">Sign up</button>
            <button id="loginModeBtn" type="button" onclick="setMode('login')">Log in</button>
        </div>

        <div class="step-indicator">
            <span id="ind1" class="active"></span>
            <span id="ind2"></span>
        </div>

        <div class="page active" id="page1">
            <div class="eyebrow"><span class="dot"></span><span id="step1Label">Step 1 of 2</span></div>
            <h1 id="page1Title">Create your account</h1>
            <p class="sub" id="page1Description">Enter your email and we'll send a one-time code to verify it.</p>

            <div class="field">
                <label for="email1">Email address</label>
                <input type="email" id="email1" placeholder="you@example.com" autocomplete="email">
                <div class="hint" id="email1Hint"></div>
            </div>

            <button id="sendOtpBtn" onclick="sendOtp()">Send verification code</button>
        </div>

        <div class="page" id="page2">
            <button class="back" onclick="goBack()">&larr; Back</button>
            <div class="eyebrow"><span class="dot"></span>Step 2 of 2</div>
            <h1 id="page2Title">Verify &amp; finish up</h1>
            <p class="sub">We sent a 6-digit code to <strong id="emailDisplay"></strong>.</p>

            <div class="field" id="nameField">
                <label for="name">Full name</label>
                <input type="text" id="name" placeholder="Jane Doe" autocomplete="name">
                <div class="hint" id="nameHint"></div>
            </div>

            <div class="field">
                <label for="email2">Email address</label>
                <input type="email" id="email2" readonly>
            </div>

            <div class="field">
                <label for="otp">One-time code</label>
                <input type="text" id="otp" placeholder="6-digit code" maxlength="6" inputmode="numeric">
                <div class="hint" id="otpHint"></div>
            </div>

            <button id="verifyBtn" onclick="verifyAndSignUp()">Verify &amp; create account</button>

            <div class="row-between">
                <span></span>
                <button class="link-btn" id="resendBtn" onclick="resendOtp()">Resend code</button>
            </div>
        </div>

    </div>

    <script>
        /* =====================================================================
           API FUNCTIONS
        ===================================================================== */

        // 1) Sends OTP request
        async function callSendOtpAPI(email) {
            const res = await fetch("/sendotp", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ email })
            });

            const data = await res.json();

            if (!res.ok) {
                throw new Error(data.message || "Failed to send OTP");
            }

            return true;
        }

        // 2) Verifies OTP and registers user
        async function callVerifyOtpAndSignUpAPI(name, email, otp) {
            const res = await fetch("/signup", {
                method: "POST",
                credentials: "include",   // Important
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ name, email, otp })
            });

            const data = await res.json();

            if (!res.ok) {
                throw new Error(data.message || "Invalid or expired verification code");
            }

            return data;
        }

        // 3) Logs in an existing user after OTP verification.
        async function callLoginAPI(email, otp) {
            const res = await fetch("/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "include",
                body: JSON.stringify({ email, otp })
            });

            const data = await res.json();

            if (!res.ok) {
                throw new Error(data.message || "Unable to log in");
            }
           
            return data;
        } async function callLoginAPI(email, otp) {
            const res = await fetch("/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "include",
                body: JSON.stringify({ email, otp })
            });

            const data = await res.json();

            if (!res.ok) {
                throw new Error(data.message || "Unable to log in");
            }

            return data;
        }

        // 4) Resends OTP
        async function callResendOtpAPI(email) {
            return callSendOtpAPI(email);
        }

        /* =====================================================================
           UI CONTROLLERS & FORM HANDLERS
        ===================================================================== */

        let resendTimer = null;
        let mode = 'signup';

        function setMode(nextMode) {
            mode = nextMode;
            const isLogin = mode === 'login';

            document.getElementById('signupModeBtn').classList.toggle('active', !isLogin);
            document.getElementById('loginModeBtn').classList.toggle('active', isLogin);
            document.getElementById('step1Label').textContent = isLogin ? 'Secure sign in' : 'Step 1 of 2';
            document.getElementById('page1Title').textContent = isLogin ? 'Welcome back' : 'Create your account';
            document.getElementById('page1Description').textContent = isLogin
                ? 'Enter your email and we\'ll send a one-time code to sign you in.'
                : 'Enter your email and we\'ll send a one-time code to verify it.';
            document.getElementById('nameField').style.display = isLogin ? 'none' : 'block';
            document.getElementById('page2Title').textContent = isLogin ? 'Verify & log in' : 'Verify & finish up';
            document.getElementById('verifyBtn').textContent = isLogin ? 'Verify & log in' : 'Verify & create account';
            goBack();
            setHint('email1Hint', '');
            setHint('nameHint', '');
        }

        function setHint(id, msg, type = 'err') {
            const hintEl = document.getElementById(id);
            const inputEl = document.getElementById(id.replace('Hint', ''));
            hintEl.textContent = msg;
            hintEl.className = `hint ${type}`;
            if (inputEl) {
                if (type === 'err' && msg) inputEl.classList.add('err');
                else inputEl.classList.remove('err');
            }
        }

        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        async function sendOtp() {
            const emailInput = document.getElementById("email1");
            const email = emailInput.value.trim();
            const btn = document.getElementById("sendOtpBtn");

            setHint("email1Hint", "");

            if (!email) {
                setHint("email1Hint", "Please enter your email address.");
                return;
            }
            if (!isValidEmail(email)) {
                setHint("email1Hint", "Please enter a valid email address.");
                return;
            }

            btn.disabled = true;
            btn.textContent = "Sending code...";

            try {
                await callSendOtpAPI(email);

                // Set up Step 2 fields
                document.getElementById("emailDisplay").textContent = email;
                document.getElementById("email2").value = email;

                // Toggle steps
                document.getElementById("page1").classList.remove("active");
                document.getElementById("page2").classList.add("active");
                document.getElementById("ind2").classList.add("active");

                startResendCooldown();
            } catch (err) {
                setHint("email1Hint", err.message || "Something went wrong. Try again.");
            } finally {
                btn.disabled = false;
                btn.textContent = "Send verification code";
            }
        }

        async function verifyAndSignUp() {
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email2").value.trim();
            const otp = document.getElementById("otp").value.trim();
            const btn = document.getElementById("verifyBtn");

            setHint("nameHint", "");
            setHint("otpHint", "");

            let hasError = false;

            if (mode === 'signup' && !name) {
                setHint("nameHint", "Full name is required.");
                hasError = true;
            }
            if (!otp || otp.length < 6) {
                setHint("otpHint", "Please enter the complete 6-digit code.");
                hasError = true;
            }

            if (hasError) return;

            btn.disabled = true;
            btn.textContent = mode === 'login' ? "Logging in..." : "Verifying...";

            try {
                if (mode === 'login') {
                    const result = await callLoginAPI(email, otp);
                    if (result.token) {
                        localStorage.setItem('authToken', result.token);
                    }
                    alert('Login successful!');
                    window.location.href = "adminportal.html";
                } else {
                    await callVerifyOtpAndSignUpAPI(name, email, otp);
                    alert("Account created successfully!");
                     window.location.href = "adminportal.html";
                }
            } catch (err) {
                setHint("otpHint", err.message || "Verification failed. Check the code and try again.");
            } finally {
                btn.disabled = false;
                btn.textContent = mode === 'login' ? "Verify & log in" : "Verify & create account";
            }
        }

        async function resendOtp() {
            const email = document.getElementById("email2").value;
            const resendBtn = document.getElementById("resendBtn");

            setHint("otpHint", "");
            resendBtn.disabled = true;

            try {
                await callResendOtpAPI(email);
                setHint("otpHint", "A new code has been sent!", "ok");
                startResendCooldown();
            } catch (err) {
                setHint("otpHint", err.message || "Could not resend code."); 
                resendBtn.disabled = false;
            }
        }

        function startResendCooldown() {
            const resendBtn = document.getElementById("resendBtn");
            let seconds = 30;
            resendBtn.disabled = true;

            clearInterval(resendTimer);
            resendTimer = setInterval(() => {
                seconds--;
                if (seconds > 0) {
                    resendBtn.textContent = `Resend code (${seconds}s)`;
                } else {
                    clearInterval(resendTimer);
                    resendBtn.textContent = "Resend code";
                    resendBtn.disabled = false;
                }
            }, 1000);
        }

        function goBack() {
            clearInterval(resendTimer);
            document.getElementById("page2").classList.remove("active");
            document.getElementById("page1").classList.add("active");
            document.getElementById("ind2").classList.remove("active");
            setHint("otpHint", "");
        }
    </script>

</body>

</html>
